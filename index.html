<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nan Wang — Ph.D. candidate in Environmental Systems Engineering, University of Regina. CGE, MRIO and factorial modelling of water–energy–economy systems.">
  <meta name="color-scheme" content="light dark">
  <title>Nan Wang · 王楠</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f4e79'/><text x='16' y='22' font-size='17' font-family='Georgia,serif' fill='white' text-anchor='middle'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav" aria-label="Primary">
      <a class="nav-brand" href="#top" data-bind="name"></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="#about"        data-nav="about"></a></li>
        <li><a href="#research"     data-nav="research"></a></li>
        <li><a href="#publications" data-nav="publications"></a></li>
        <li><a href="#experience"   data-nav="experience"></a></li>
        <li><a href="#education"    data-nav="education"></a></li>
        <li><a href="#skills"       data-nav="skills"></a></li>
        <li><a href="#service"      data-nav="service"></a></li>
        <li><a href="#contact"      data-nav="contact"></a></li>
      </ul>
      <div class="nav-tools">
        <button class="lang-toggle" id="langToggle" aria-label="Switch language">中文</button>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main id="top">

    <!-- ===== Hero ===== -->
    <section class="hero" id="about">
      <div class="container hero-grid">
        <div class="hero-text">
          <p class="eyebrow" data-bind="nameAlt"></p>
          <h1 data-bind="name"></h1>
          <p class="hero-title" data-bind="title"></p>
          <p class="hero-affil" data-bind-html="affil"></p>
          <p class="hero-tagline" data-bind="tagline"></p>
          <div class="hero-actions" id="heroActions"></div>
        </div>
        <div class="hero-photo">
          <img src="assets/photo.jpg" alt="Nan Wang" onerror="this.parentElement.classList.add('no-photo')">
          <div class="photo-placeholder" aria-hidden="true">N</div>
        </div>
      </div>
    </section>

    <!-- ===== About ===== -->
    <section class="section">
      <div class="container">
        <h2 data-nav="about"></h2>
        <div class="prose" id="aboutText"></div>
      </div>
    </section>

    <!-- ===== Research ===== -->
    <section class="section section-alt" id="research">
      <div class="container">
        <h2 data-nav="research"></h2>
        <ul class="interest-grid" id="interests"></ul>
      </div>
    </section>

    <!-- ===== Publications ===== -->
    <section class="section" id="publications">
      <div class="container">
        <h2 data-nav="publications"></h2>
        <ol class="pub-list" id="pubList"></ol>
        <h3 class="subhead" data-ui="inProgress"></h3>
        <ul class="wip-list" id="wipList"></ul>
      </div>
    </section>

    <!-- ===== Experience ===== -->
    <section class="section section-alt" id="experience">
      <div class="container">
        <h2 data-nav="experience"></h2>
        <div class="timeline" id="expList"></div>
      </div>
    </section>

    <!-- ===== Education ===== -->
    <section class="section" id="education">
      <div class="container">
        <h2 data-nav="education"></h2>
        <div class="timeline" id="eduList"></div>
      </div>
    </section>

    <!-- ===== Skills ===== -->
    <section class="section section-alt" id="skills">
      <div class="container">
        <h2 data-nav="skills"></h2>
        <div class="skill-groups" id="skillList"></div>
      </div>
    </section>

    <!-- ===== Service ===== -->
    <section class="section" id="service">
      <div class="container">
        <h2 data-nav="service"></h2>
        <ul class="service-list" id="serviceList"></ul>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <h2 data-nav="contact"></h2>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> <span data-bind="name"></span></span>
      <span class="footer-sep">·</span>
      <span><span data-ui="footer"></span> <span data-bind="lastUpdated"></span></span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
